<g data-node-id="n14"><text x="705" y="269.2" text-anchor="middle" font-family="Helvetica, Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Noto Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif" font-size="12" fill="#000000" xml:space="preserve"><tspan x="705" dy="0">scaleX = 1 + |Δx| / 500（上限 </tspan><tspan x="705" dy="14">1.14）</tspan><tspan x="705" dy="14">scaleY = 1 − |Δx| / 1400（下限</tspan><tspan x="705" dy="14"> 0.90）</tspan><tspan x="705" dy="14">rotation = Δx / 28（夹在 ±10°</tspan><tspan x="705" dy="14">）</tspan></text></g>
