<g data-node-id="n17"><text x="550" y="469.2" text-anchor="middle" font-family="Helvetica, Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Noto Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;WenQuanYi Micro Hei&quot;, sans-serif" font-size="12" fill="#000000" xml:space="preserve"><tspan x="550" dy="0">交互细节：光标/手指按下 → 玻璃高光沿拖动方向偏移；抬指 → 0.35s 内形变归零，同时高光回正。</tspan></text></g>
