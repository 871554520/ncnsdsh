workflows:
  ncnsdsh-unsigned-ipa:
    name: NcnsDSH unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build unsigned app
        script: |
          set -e
          xcodebuild \
            -project NcnsDSH.xcodeproj \
            -scheme NcnsDSH \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NcnsDSH.app Payload/
          zip -qry NcnsDSH-unsigned.ipa Payload
          shasum -a 256 NcnsDSH-unsigned.ipa
    artifacts:
      - NcnsDSH-unsigned.ipa
